<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ACQ Sổ việc">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} img{max-width:100%} [hidden]{display:none!important}</style>
</head>
<body>
<title>ACQ Smarthome · Sổ việc</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: "bảng điều khiển kỹ thuật" — thanh điều hướng trái (desktop) / dưới (điện thoại), lưới thẻ, số liệu lớn kiểu đồng hồ đo. Tối là mặc định. */
:root{
  --bg:#0b1016; --bg2:#0f161e; --panel:#141c26; --panel2:#1b2531; --line:#243140; --line2:#2f3f52;
  --fg:#e8eef5; --muted:#8a9bb0; --accent:#19d3f0; --accent-fg:#06161c; --accent-soft:#0e3340; --accent2:#ffb02e;
  --ok:#3ddc84; --ok-soft:#0f3324; --warn:#ffb02e; --warn-soft:#3a2a0b; --bad:#ff5c6c; --bad-soft:#3d1218;
  --info:#19d3f0; --info-soft:#0e3340; --hold:#b48cff; --hold-soft:#2a1f45;
  --glow:0 0 0 1px rgba(25,211,240,.25),0 8px 30px rgba(25,211,240,.08);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --disp:"Chakra Petch","Be Vietnam Pro",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef2f6; --bg2:#e6ebf1; --panel:#ffffff; --panel2:#f1f4f8; --line:#d5dde7; --line2:#c3cedb;
  --fg:#101820; --muted:#5b6b7d; --accent:#0a97b0; --accent-fg:#ffffff; --accent-soft:#d9f3f8; --accent2:#c77a00;
  --ok:#1f9e5a; --ok-soft:#d9f3e4; --warn:#b36f00; --warn-soft:#fff0d1; --bad:#d13644; --bad-soft:#fde0e3;
  --info:#0a97b0; --info-soft:#d9f3f8; --hold:#7445d6; --hold-soft:#e9e0fb;
  --glow:0 0 0 1px rgba(10,151,176,.25),0 8px 24px rgba(10,151,176,.10); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef2f6; --bg2:#e6ebf1; --panel:#ffffff; --panel2:#f1f4f8; --line:#d5dde7; --line2:#c3cedb;
  --fg:#101820; --muted:#5b6b7d; --accent:#0a97b0; --accent-fg:#ffffff; --accent-soft:#d9f3f8; --accent2:#c77a00;
  --ok:#1f9e5a; --ok-soft:#d9f3e4; --warn:#b36f00; --warn-soft:#fff0d1; --bad:#d13644; --bad-soft:#fde0e3;
  --info:#0a97b0; --info-soft:#d9f3f8; --hold:#7445d6; --hold-soft:#e9e0fb;
  --glow:0 0 0 1px rgba(10,151,176,.25),0 8px 24px rgba(10,151,176,.10); color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(1200px 500px at 80% -200px,var(--accent-soft),transparent 60%);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--disp);font-weight:600;letter-spacing:.01em}
h1{font-size:1.5rem}h2{font-size:1.1rem}h3{font-size:.95rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* shell */
#app{display:flex;min-height:100%}
.rail{display:none}
.main{flex:1;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 96px;max-width:1140px;margin:0 auto;width:100%}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:8px 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand{font-family:var(--disp);font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px var(--accent);display:inline-block}
.topbar .sp{flex:1}
.avatar{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:.85rem;flex:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.tabbar button{flex:1;background:none;border:0;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.66rem;font-weight:500;color:var(--muted);cursor:pointer}
.tabbar button svg{width:22px;height:22px}
.tabbar button.active{color:var(--accent)}
@media(min-width:900px){
  .rail{display:flex;flex-direction:column;gap:4px;width:224px;flex:none;padding:18px 12px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;background:var(--bg2)}
  .rail .brand{padding:6px 10px 18px;font-size:1rem}
  .rail button{text-align:left;background:none;border:0;border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:center;color:var(--fg);font-weight:500}
  .rail button svg{width:20px;height:20px;color:var(--muted)}
  .rail button.active{background:var(--accent-soft);color:var(--accent)}
  .rail button.active svg{color:var(--accent)}
  .rail .foot{margin-top:auto;padding:10px 12px;font-size:.82rem;color:var(--muted)}
  .tabbar{display:none}
  .main{padding-block:16px 40px}
}

/* components */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:.92rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#06161c}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn.big{padding:13px 18px;font-size:1rem;width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea,.inp{font-size:.95rem;color:var(--fg);background:var(--bg2);border:1px solid var(--line2);border-radius:9px;padding:9px 10px;width:100%}
textarea{resize:vertical;min-height:70px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:.84rem;cursor:pointer;white-space:nowrap;font-weight:500}
.chip.active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 8px;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-family:var(--mono)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-moi{background:var(--info-soft);color:var(--info)}
.s-dang_lam{background:var(--warn-soft);color:var(--warn)}
.s-cho_vat_tu{background:var(--hold-soft);color:var(--hold)}
.s-hoan_thanh{background:var(--ok-soft);color:var(--ok)}
.s-huy{background:var(--panel2);color:var(--muted)}
.job{display:grid;grid-template-columns:5px 1fr;gap:10px;cursor:pointer;padding:8px 10px 8px 8px;transition:border-color .15s;position:relative}
.job:hover{border-color:var(--accent)}
.job .bar{border-radius:3px;background:var(--line2)}
.job.p-vua .bar{background:var(--warn)}
.job.p-cao{background:color-mix(in srgb,var(--bad) 9%,var(--panel));border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.job.p-cao .bar{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.job.overdue{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
.job.overdue .bar{background:var(--bad);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.job.overdue .bar{animation:none}}
.job.closed{opacity:.62}
.job .l1{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow:hidden;white-space:nowrap;font-size:.74rem;color:var(--muted)}
.job .l1 .pill{flex:none}
.job .t{font-weight:600;font-size:.95rem;line-height:1.25;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
@media(min-width:900px){.job .t{-webkit-line-clamp:2}}
.job .meta{display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden;white-space:nowrap;font-size:.78rem;color:var(--muted);margin-top:3px}
.job .meta>span{overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.job .meta .sep{flex:none;opacity:.5}
.job .over{color:var(--bad);font-weight:700;flex:none!important}
.job .urg{color:var(--bad);font-weight:700;letter-spacing:.04em}
.job .seqbtn{position:absolute;right:8px;top:6px;display:flex;gap:2px}
.prog{display:flex;align-items:center;gap:8px;margin-top:4px}.prog .pb{flex:1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}.prog .pb i{display:block;height:100%;background:var(--accent)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:8;background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;padding:13px 20px;font-weight:700;font-family:var(--disp);box-shadow:var(--glow);cursor:pointer;letter-spacing:.03em}
@media(min-width:900px){.fab{bottom:28px}}
.modal-bg{position:fixed;inset:0;background:rgba(3,8,14,.7);backdrop-filter:blur(3px);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal-bg{align-items:center}}
.modal{background:var(--panel);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;border:1px solid var(--line);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media(min-width:700px){.modal{border-radius:14px;padding:20px}}
.modal.wide{max-width:880px}
.mhead{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.mhead>div:first-child,.mhead h2{flex:1;min-width:0}
.x{background:none;border:0;font-size:1.5rem;cursor:pointer;color:var(--muted);line-height:1}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);white-space:nowrap;font-weight:600;font-size:.88rem}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;font-family:var(--mono)}
td.r,th.r{text-align:right}
.twrap{overflow-x:auto}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
@media(max-width:600px){.kpi{display:flex;overflow-x:auto;scrollbar-width:none;gap:8px;margin:0 -2px;padding:2px}.kpi .card{flex:0 0 118px;padding:8px 10px}.kpi .v{font-size:1.25rem}}
.kpi .card{padding:10px 12px;position:relative;overflow:hidden}
.kpi .card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--line2)}
.kpi .card.hi::after{background:var(--accent)}
.kpi .card.bad::after{background:var(--bad)}
.kpi .card.ok::after{background:var(--ok)}
.kpi .v{font-family:var(--disp);font-size:1.6rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.74rem;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.log{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.log .av{width:30px;height:30px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex:none;font-family:var(--disp)}
.log.ci .av{background:var(--ok-soft);color:var(--ok)}
.log.co .av{background:var(--warn-soft);color:var(--warn)}
.log img{max-width:160px;border-radius:6px;display:block;margin-top:6px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{border-radius:999px;border:1px solid var(--line2);background:var(--panel2);padding:6px 12px;font-size:.84rem;cursor:pointer;font-weight:500}
.steps button.cur{font-weight:700;border-width:2px}
.bars{display:flex;flex-direction:column;gap:6px}
.bars .b{display:grid;grid-template-columns:110px 1fr 56px;gap:8px;align-items:center;font-size:.84rem}
.bars .b .t{height:12px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bars .b .t i{display:block;height:100%;background:var(--accent)}
.low{color:var(--bad);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:30;font-size:.9rem;font-weight:500;max-width:90vw;text-align:center}
@media(min-width:900px){.toast{bottom:30px}}
.login{max-width:440px;margin:6vh auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login .u{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--panel)}
.login .u:hover{border-color:var(--accent);box-shadow:var(--glow)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.84rem}
.onsite{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ok-soft);border:1px solid var(--ok);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:.88rem}
.onsite.warn{background:var(--bad-soft);border-color:var(--bad)}
.cam{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column}
.cam video{flex:1;width:100%;object-fit:cover;background:#000}
.cam .bar2{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:#0b1016;color:#e8eef5}
.cam .shut{width:68px;height:68px;border-radius:50%;border:4px solid #e8eef5;background:#19d3f0;cursor:pointer}
.cam .stamp{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);padding:8px 16px;font-family:var(--mono);font-size:.72rem;color:#e8eef5;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.badge{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;border-radius:999px;font-size:.66rem;font-weight:700;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:var(--mono)}
.note.info{background:var(--accent-soft);color:var(--accent)}
.action{display:grid;gap:8px;grid-template-columns:1fr}
@media(min-width:520px){.action.two{grid-template-columns:1fr 1fr}}
.geo{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
svg.chart .bar{fill:var(--accent)}
svg.chart .bar.dim{fill:var(--line2)}
svg.chart .bar.ok{fill:var(--ok)}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .lbl{fill:var(--fg);font-weight:600}
.sheetimg{width:100%;border-radius:8px;border:1px solid var(--line);display:block;background:#fff}
.sig-wrap{border:1px dashed var(--line2);border-radius:10px;background:#fff;overflow:hidden}
.sig-wrap canvas{width:100%;height:170px;display:block;touch-action:none}
.timeline{display:flex;flex-direction:column;gap:4px}
.timeline .tl{display:grid;grid-template-columns:52px 1fr;gap:10px;font-size:.84rem;padding:5px 0;border-bottom:1px dashed var(--line)}
.timeline .tl .tm{font-family:var(--mono);color:var(--muted)}
.flag{color:var(--bad);font-weight:600}
</style>

<div id="root"></div>

<script>
/* ===================== CẤU HÌNH & LỚP DỮ LIỆU ===================== */
const CFG = window.APP_CONFIG || {};
const TABLES = ['settings','users','customers','jobs','job_logs','items','job_items','expenses','payments','acceptances','notifications'];
const STATUS = {moi:'Mới', dang_lam:'Đang làm', cho_vat_tu:'Chờ vật tư', hoan_thanh:'Hoàn thành', huy:'Hủy'};
const TYPES = {lap:'Lắp đặt', sua:'Sửa chữa', baotri:'Bảo trì', ban:'Bán hàng', khaosat:'Khảo sát', khac:'Khác'};
const PRIO = {cao:'Gấp', vua:'Bình thường'};
const MODES = {onsite:'Tại công trình', remote:'Từ xa (online)', delivery:'Giao hàng (đã làm sẵn)'};
const isRemoteSession = l => !!(l && (l.remote));
const EST = [[2,'2 giờ'],[4,'4 giờ'],[8,'1 ngày'],[16,'2 ngày'],[24,'3 ngày'],[40,'1 tuần']];
const jobMinutes = j => DB.users.reduce((a,u)=>a+sessions(u.id).filter(x=>x.job_id===j.id).reduce((b,x)=>b+x.min,0),0);
const modeSel = (v)=>`<select name="mode">${Object.entries(MODES).map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${l}</option>`).join('')}</select>`;
const estSel = (v)=>`<select name="est"><option value="">— chưa ước tính —</option>${EST.map(([h,l])=>`<option value="${h}" ${+v===h?'selected':''}>${l}</option>`).join('')}</select>`;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
const now = () => new Date().toISOString();
const fmtVND = n => (Math.round(+n||0)).toLocaleString('vi-VN') + ' đ';
const fmtD = s => s ? new Date(s).toLocaleDateString('vi-VN') : '';
const fmtT = s => s ? new Date(s).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}) : '';
const fmtDT = s => s ? new Date(s).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}) : '';
const fmtH = min => min<60 ? Math.round(min)+' ph' : (min/60).toFixed(1).replace('.0','')+' giờ';
const F = f => new Proxy(f,{get:(o,k)=>{const e=o.elements&&typeof k==='string'&&o.elements.namedItem(k); return e||Reflect.get(o,k);}});

const isOverdue = j => j.due_at && !['hoan_thanh','huy'].includes(j.status) && new Date(j.due_at) < new Date();
const isClosed = j => ['hoan_thanh','huy'].includes(j.status);
const logOrder=(a,b)=>(new Date(a.created_at)-new Date(b.created_at))||((a.type==='checkout'?0:1)-(b.type==='checkout'?0:1));
const openCheckin = (jobId,userId) => { const ls=DB.job_logs.filter(l=>l.job_id===jobId&&l.user_id===userId&&(l.type==='checkin'||l.type==='checkout')).sort(logOrder); const last=ls[ls.length-1]; return last&&last.type==='checkin'?last:null; };
/* phiên làm việc tại công trình = cặp check-in → check-out */
const MAX_MIN=600, FAR_M=300;
function sessions(userId, from){
  const ls=DB.job_logs.filter(l=>l.user_id===userId&&(l.type==='checkin'||l.type==='checkout')&&(!from||new Date(l.created_at)>=from)).sort(logOrder);
  const out=[]; const open={};
  for(const l of ls){ if(l.type==='checkin') open[l.job_id]=l; else if(open[l.job_id]){ const raw=(new Date(l.created_at)-new Date(open[l.job_id].created_at))/6e4; out.push({job_id:l.job_id,start:open[l.job_id].created_at,end:l.created_at,min:Math.min(raw,MAX_MIN),raw,flag:l.flag||(raw>MAX_MIN?'long':null),remote:isRemoteSession(open[l.job_id]),ci:open[l.job_id],co:l}); delete open[l.job_id]; } }
  for(const k in open){ const raw=(Date.now()-new Date(open[k].created_at))/6e4; out.push({job_id:k,start:open[k].created_at,end:null,min:Math.min(raw,MAX_MIN),raw,open:true,flag:raw>MAX_MIN?'forgot':null,remote:isRemoteSession(open[k]),ci:open[k]}); }
  return out;
}
const FLAG_TXT = {forgot:'quên bấm rời', long:'ca quá 10 giờ', far:'rời công trình không bấm', auto:'tự đóng khi bắt đầu việc khác', owner:'chủ đóng ca', far_start:'bắt đầu cách vị trí công trình đã ghim', nogps:'ca không có GPS', quick:'nghiệm thu dưới 10 phút sau khi bắt đầu', nosession:'không có ca bắt đầu', remote_only:'việc tại công trình nhưng chỉ có ca từ xa', unpaid:'chưa thu tiền khi bàn giao'};
const mySessions = (jobId,uid) => sessions(uid).filter(x=>x.job_id===jobId);
const canAccept = j => { if(isOwner()) return true; if(j.mode==='remote') return mySessions(j.id,me().id).length>0; if(j.mode==='delivery') return true; const ci=openCheckin(j.id,me().id); return !!(ci && !isRemoteSession(ci)); };
const myOpenSessions = uid => DB.jobs.map(j=>({j,ci:openCheckin(j.id,uid)})).filter(x=>x.ci);
function distM(a,b){ const R=6371000, toR=x=>x*Math.PI/180; const dLat=toR(b.lat-a.lat), dLng=toR(b.lng-a.lng); const h=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
/* kiểm tra lặng lẽ: nếu đang mở ca mà vị trí hiện tại cách điểm bắt đầu > FAR_M thì tự đóng ca và gắn cờ */
async function silentGeoCheck(){
  const open=myOpenSessions(me().id); if(!open.length) return;
  const g=await getLocation(); if(!g) return; let closed=false;
  for(const {j,ci} of open){ if(j.mode&&j.mode!=='onsite') continue; if(isRemoteSession(ci)) continue; if(ci.lat&&ci.lng){ const dm=Math.round(distM(ci,g)); if(dm>FAR_M&&g.acc<dm/2){ await Store.insert('job_logs',Object.assign({job_id:j.id,user_id:me().id,type:'checkout',text:`Tự động đóng ca – phát hiện cách công trình ${dm} m khi thao tác`,flag:'far'},g)); closed=true; } } }
  if(closed){ await notify(owners(),'⚑ '+shortName(me().id)+' rời công trình không bấm','Ca tự đóng do thao tác cách công trình > '+FAR_M+' m',open[0].j.id,'flag'); toast('Bạn đang ở xa công trình nên ca đã tự đóng và được gắn cờ'); if(S.modal&&S.modal.jobId) openJob(S.modal.jobId,S.modal.jobTab); else render(); }
}
let toastT; function toast(msg){ let t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);} t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2600); }
function fileToDataURL(file,max=900){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=img.width*sc; c.height=img.height*sc; c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.8)); }; img.src=r.result; }; r.readAsDataURL(file); }); }
function getLocation(){ return new Promise(res=>{ if(!navigator.geolocation) return res(null); let done=false; const fin=v=>{ if(!done){done=true;res(v);} }; try{ navigator.geolocation.getCurrentPosition(p=>fin({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}),()=>fin(null),{enableHighAccuracy:true,timeout:12000,maximumAge:30000}); }catch(e){ fin(null); } setTimeout(()=>fin(null),13000); }); }

async function enablePush(){

}

function navItems(){ const n=[['viec','Việc'],['kho','Kho'],['hieusuat','Hiệu suất']]; if(isOwner()) n.push(['thuchi','Thu chi'],['baocao','Báo cáo'],['nhansu','Nhân sự']); else n.push(['thuchi','Chi của tôi']); return n; }
function render(){
  const root=document.getElementById('root'); const upd=document.getElementById('updbar'); if(upd) upd.remove();
  if(!S.user){ root.innerHTML=renderLogin(); return; }
  const nav=navItems(); if(!nav.some(n=>n[0]===S.tab)) S.tab='viec';
  root.innerHTML=`<div id="app">
    <nav class="rail"><div class="brand"><i></i>${esc(setting().shop_name)}</div>
      ${nav.map(([k,l])=>`<button class="${S.tab===k?'active':''}" data-tab="${k}">${ICON[k]}${l}</button>`).join('')}
      <div class="foot"><b>${esc(me().name)}</b><br>${isOwner()?'Chủ cửa hàng':'Kỹ thuật viên'}<br><a href="#" data-act="logout">Đăng xuất</a>${!isRemote()?' · <a href="#" data-act="reset">Nạp lại dữ liệu mẫu</a>':''}</div></nav>
    <div class="main">
      <div class="topbar"><span class="brand"><i></i>${esc(setting().shop_name)}</span><span class="sp"></span><button class="btn sm ghost" data-act="notifs" style="position:relative;padding:6px 8px" aria-label="Thông báo">🔔${unreadCount()?`<span class="badge">${unreadCount()}</span>`:''}</button><span class="avatar">${initials(me().id)}</span><button class="btn sm ghost" data-act="logout">Thoát</button></div>
      ${!isRemote()?'<div class="note" style="margin-bottom:12px">Bản thử nghiệm: dữ liệu mẫu lưu trên máy này, chưa dùng chung nhiều người. Định vị GPS và tải ảnh phiếu hoạt động đầy đủ ở bản triển khai.</div>':''}
      ${bannerHTML()}
      <div id="view"></div>
    </div>
    <nav class="tabbar">${nav.map(([k,l])=>`<button class="${S.tab===k?'active':''}" data-tab="${k}">${ICON[k]}${l}</button>`).join('')}</nav>
    ${S.tab==='viec'&&isOwner()?'<button class="fab" data-act="newjob">+ VIỆC MỚI</button>':''}
    ${S.modal?`<div class="modal-bg" data-act="closemodal"><div class="modal ${S.modal.wide?'wide':''}">${S.modal.html}</div></div>`:''}
  </div>`;
  document.getElementById('view').innerHTML=({viec:renderJobs,kho:renderKho,thuchi:renderThuChi,hieusuat:renderHieuSuat,baocao:renderBaoCao,nhansu:renderNhanSu}[S.tab])();
  if(S.modal && S.modal.after) S.modal.after();
  if(window.__newVersionReady){ const b=document.createElement('div'); b.id='updbar'; b.className='toast'; b.style.cssText='bottom:auto;top:calc(8px + env(safe-area-inset-top,0px));background:var(--accent);color:var(--accent-fg);cursor:pointer;font-weight:600'; b.textContent='⬆ Có bản cập nhật mới – nhấn để tải lại'; b.onclick=()=>window.__applyUpdate&&window.__applyUpdate(); document.body.appendChild(b); }
}
function bannerHTML(){ const open=myOpenSessions(me().id); if(!open.length) return ''; return open.map(({j,ci})=>{ const min=(Date.now()-new Date(ci.created_at))/6e4; const warn=min>480; return `<div class="onsite ${warn?'warn':''}"><div style="min-width:0"><b>${j.mode==='remote'||isRemoteSession(ci)?'Đang làm từ xa':'Đang tại công trình'}</b> <span class="mono">${esc(j.code)}</span> · ${esc(j.title)}<div class="small">từ <span class="mono">${fmtT(ci.created_at)}</span> · ${fmtH(min)}${warn?' · nhớ bấm rời khi xong':''}</div></div><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-openjob="${j.id}">Mở</button><button class="btn sm ${warn?'danger':''}" data-quickout="${j.id}">■ Rời</button></div></div>`; }).join(''); }
function renderLogin(){
  const head=`<div class="brand" style="font-size:1.3rem;margin-bottom:4px"><i></i>${esc(setting().shop_name||'ACQ Smarthome')}</div><p class="eyebrow" style="margin-bottom:16px">Sổ việc · kho · thu chi · nghiệm thu</p>`;

    ${DB.users.filter(u=>u.active!==false).map(u=>`<div class="u" data-login="${u.id}"><span class="avatar">${initials(u.id)}</span><div><div><b>${esc(u.name)}</b></div><div class="small muted">${u.role==='owner'?'Chủ cửa hàng':'Kỹ thuật viên'} · <span class="mono">${esc(u.phone||'')}</span></div></div></div>`).join('')}</div>`;
}

function renderJobs(){
  const f=S.jobFilter; if(!isOwner()) f.mine=true; let list=DB.jobs.slice();
  if(f.mine) list=list.filter(j=>j.assignee_id===me().id);
  if(f.status) list=list.filter(j=>j.status===f.status);
  if(f.q){ const q=f.q.toLowerCase(); list=list.filter(j=>[j.code,j.title,cust(j.customer_id).name,cust(j.customer_id).phone,jobAddr(j)].join(' ').toLowerCase().includes(q)); }
  list.sort((a,b)=>{ if(isClosed(a)!==isClosed(b)) return isClosed(a)?1:-1; if(f.mine&&(a.seq||b.seq)) return (a.seq||999)-(b.seq||999); const pa=a.priority==='cao'?0:1, pb=b.priority==='cao'?0:1; if(pa!==pb) return pa-pb; const oa=isOverdue(a)?0:1, ob=isOverdue(b)?0:1; if(oa!==ob) return oa-ob; return (new Date(a.due_at||'2100')-new Date(b.due_at||'2100')); });
  S._list=list.filter(j=>!isClosed(j)).map(j=>j.id);
  const base=isOwner()?DB.jobs:DB.jobs.filter(j=>j.assignee_id===me().id); const open=base.filter(j=>!isClosed(j)); const over=open.filter(isOverdue); const onsite=DB.users.filter(u=>DB.jobs.some(j=>openCheckin(j.id,u.id)));
  return `<div class="stack">
    <div class="kpi"><div class="card hi"><div class="v">${open.length}</div><div class="l">Việc đang mở</div></div><div class="card ${over.length?'bad':''}"><div class="v" style="color:${over.length?'var(--bad)':'inherit'}">${over.length}</div><div class="l">Quá hạn</div></div>${isOwner()?`<div class="card"><div class="v">${DB.jobs.filter(j=>j.status==='moi'&&!j.assignee_id).length}</div><div class="l">Chưa phân công</div></div><div class="card ok"><div class="v">${onsite.length}</div><div class="l">KTV đang tại công trình</div></div>`:`<div class="card ok"><div class="v">${base.filter(j=>j.status==='hoan_thanh'&&j.done_at&&new Date(j.done_at)>=periodRangeOf('tuan')).length}</div><div class="l">Xong tuần này</div></div>`}</div>
    <input class="inp" id="jq" placeholder="Tìm mã, tên khách, SĐT, nội dung…" value="${esc(f.q)}">
    ${isOwner()?`<div class="row" style="gap:6px"><span class="eyebrow">KTV</span><span class="chip ${!f.mine?'active':''}" data-mine="1">Tất cả</span><span class="chip ${f.mine?'active':''}" data-mine="1">Việc tôi tự nhận</span></div>`:`<p class="small muted">Việc được giao cho bạn · dùng ▲▼ để tự sắp thứ tự trong ngày</p>`}
    <div class="chips"><span class="eyebrow" style="align-self:center;margin-right:4px">Trạng thái</span><span class="chip ${!f.status?'active':''}" data-st="">Tất cả</span>${Object.entries(STATUS).map(([k,v])=>`<span class="chip ${f.status===k?'active':''}" data-st="${k}">${v}</span>`).join('')}</div>
    <div class="stack">${list.length?list.map(jobCard).join(''):'<div class="empty">Không có việc nào khớp bộ lọc.</div>'}</div></div>`;
}
function jobCard(j){ const c=cust(j.customer_id); const acc=DB.acceptances.find(a=>a.job_id===j.id); const ci=j.assignee_id&&openCheckin(j.id,j.assignee_id); const od=isOverdue(j); const t=jobTotals(j);
  const tags=[`<span class="mono">${esc(j.code)}</span>`,`<span class="pill s-${j.status}">${STATUS[j.status]}</span>`];
  if(j.priority==='cao'&&!isClosed(j)) tags.push('<span class="urg">GẤP</span>');
  if(j.mode&&j.mode!=='onsite') tags.push(`<span class="pill s-cho_vat_tu">${j.mode==='remote'?'Từ xa':'Giao hàng'}</span>`);
  if(ci) tags.push('<span class="pill s-hoan_thanh">Đang làm</span>'); else if(j.status==='dang_lam') tags.push('<span>· tạm dừng</span>');
  if(j.status==='hoan_thanh'){ tags.push(acc?(acc.mode==='photo'?'<span class="pill s-hoan_thanh">✓ ảnh</span>':'<span class="pill s-hoan_thanh">✓ ký</span>'):'<span class="pill s-dang_lam">chưa phiếu</span>'); if(isOwner()&&(j.quote||0)>t.paid) tags.push('<span class="pill s-dang_lam">chưa thu đủ</span>'); }
  const meta=[]; meta.push(`<span>${esc(c.name||'—')}</span>`); if(jobAddr(j)) meta.push(`<span>${esc(jobAddr(j))}</span>`); meta.push(j.assignee_id?`<span>${esc(shortName(j.assignee_id))}</span>`:'<span style="color:var(--warn);flex:none">chưa giao</span>'); if(j.due_at&&!isClosed(j)) meta.push(`<span class="${od?'over':''}" style="flex:none">${od?'⚠ quá hạn ':''}${fmtDT(j.due_at)}</span>`);
  return `<div class="card job p-${j.priority} ${od?'overdue':''} ${isClosed(j)?'closed':''}" data-job="${j.id}"><div class="bar"></div><div style="min-width:0">
  <div class="l1">${tags.join(' ')}</div>
  <div class="t">${esc(j.title)}</div>
  ${!isClosed(j)&&(j.est||j.progress)?`<div class="prog"><div class="pb"><i style="width:${Math.min(100,+j.progress||0)}%"></i></div><span class="small muted mono" style="flex:none">${+j.progress||0}%${j.est?` · ${fmtH(jobMinutes(j))}/${j.est}h`:''}</span></div>`:''}
  <div class="meta">${meta.join('<span class="sep">·</span>')}</div></div>
  ${S.jobFilter.mine&&!isClosed(j)?`<span class="seqbtn"><button class="btn sm ghost" data-seq="${j.id}" data-dir="-1" title="Lên">▲</button><button class="btn sm ghost" data-seq="${j.id}" data-dir="1" title="Xuống">▼</button></span>`:''}</div>`; }
function openNewJob(){
  const staff=DB.users.filter(u=>u.active!==false);
  const toLocal=dt=>new Date(dt-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
  S.modal={html:`<div class="mhead"><h2>Việc mới</h2><button class="x" data-act="closemodal">×</button></div>
  <form id="jobf" class="stack">
    <div class="chips" id="modechips">${Object.entries(MODES).map(([k,l])=>`<span class="chip ${k==='onsite'?'active':''}" data-mode="${k}">${l}</span>`).join('')}</div>
    <div class="grid2"><label class="f">Tên khách (gõ để gợi ý khách cũ)<input name="cname" list="custlist" required autocomplete="off"><datalist id="custlist">${DB.customers.map(c=>`<option value="${esc(c.name)}">${esc(c.phone||'')}</option>`).join('')}</datalist></label><label class="f">Số điện thoại (dán SĐT để tự ra tên)<input name="cphone" inputmode="tel" list="phonelist" autocomplete="off"><datalist id="phonelist">${DB.customers.filter(c=>c.phone).map(c=>`<option value="${esc(c.phone)}">${esc(c.name)}</option>`).join('')}</datalist></label></div>
    <div id="custhint" class="small muted"></div>
    <label class="f" id="f_addr">Địa chỉ công trình (chọn địa chỉ đã lưu hoặc gõ mới)<input name="caddr" list="addrlist" autocomplete="off"><datalist id="addrlist"></datalist></label>
    <label class="f" id="f_maps">Link Google Maps / tọa độ khách gửi (tùy chọn)<input name="maps" placeholder="Dán link định vị khách gửi qua Zalo, hoặc 15.1214, 108.8044"></label>
    <label class="f" id="f_title">Nội dung yêu cầu<input name="title" required placeholder="VD: Lắp 2 camera cổng"></label>
    <div class="grid2"><label class="f">Mức độ<select name="priority"><option value="vua">Bình thường (hẹn sau 1 giờ)</option><option value="cao">Gấp (hẹn sau 30 phút)</option></select></label><label class="f" id="f_due">Hẹn khách<input name="due" type="datetime-local" value="${toLocal(new Date(Date.now()+60*6e4))}"></label></div>
    <div class="grid2" id="f_est"><label class="f" hidden>Hình thức${modeSel('onsite')}<select name="type" hidden><option value="khac" selected>khac</option></select></label><label class="f">Ước tính thời gian${estSel('')}</label></div>
    <label class="f">Ghi chú chi tiết<textarea name="description"></textarea></label>
    <div class="grid2"><label class="f">Giao cho KTV<select name="assignee"><option value="">— Chưa phân công —</option>${staff.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></label>${isOwner()?'<label class="f">Giá chốt với khách (đ) — KTV sẽ được báo thu khi hoàn thành<input name="quote" inputmode="numeric" placeholder="0"></label>':''}</div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" data-act="closemodal">Hủy</button><button class="btn primary">Tạo việc</button></div></form>`,
  after(){ const f=F(document.getElementById('jobf')); let dueTouched=false; f.due.addEventListener('input',()=>dueTouched=true);
    f.priority.addEventListener('change',()=>{ if(dueTouched) return; f.due.value=toLocal(new Date(Date.now()+(f.priority.value==='cao'?30:60)*6e4)); });
    const hint=document.getElementById('custhint'); const dl=document.getElementById('addrlist');
    const applyCust=c=>{ const addrs=c?[c.address,...(c.sites||[]).map(x=>x.address)].filter(Boolean):[]; dl.innerHTML=[...new Set(addrs)].map(a=>`<option value="${esc(a)}">`).join(''); if(c){ const n=DB.jobs.filter(j=>j.customer_id===c.id).length; hint.innerHTML=`Khách cũ · ${n} việc trước · ${addrs.length} địa chỉ đã lưu`; if(!f.caddr.value&&addrs[0]) f.caddr.value=addrs[0]; } else hint.textContent=''; };
    f.cphone.addEventListener('input',()=>{ const ph=f.cphone.value.replace(/\D/g,''); const c=DB.customers.find(x=>x.phone===ph); if(c){ f.cname.value=c.name; } applyCust(c); });
    f.cname.addEventListener('input',()=>{ const nm=f.cname.value.trim().toLowerCase(); const matches=DB.customers.filter(x=>x.name.toLowerCase()===nm); const c=matches.length===1?matches[0]:null; if(c&&!f.cphone.value) f.cphone.value=c.phone||''; applyCust(c); });
    f.caddr.addEventListener('focus',()=>{ if(!dl.innerHTML){ const ph=f.cphone.value.replace(/\D/g,''); applyCust(DB.customers.find(x=>x.phone===ph)); } });
    const setMode=m=>{ f.mode.value=m; [...document.querySelectorAll('#modechips .chip')].forEach(c=>c.classList.toggle('active',c.dataset.mode===m)); const dlv=m==='delivery', rm=m==='remote'; document.getElementById('f_est').hidden=dlv; document.getElementById('f_addr').firstChild.textContent=dlv?'Địa chỉ giao hàng':rm?'Địa chỉ khách (tham khảo)':'Địa chỉ công trình (chọn địa chỉ đã lưu hoặc gõ mới)'; document.getElementById('f_maps').hidden=rm; document.getElementById('f_title').firstChild.textContent=dlv?'Hàng giao / nội dung bàn giao':rm?'Việc cần xử lý từ xa':'Nội dung yêu cầu'; f.title.placeholder=dlv?'VD: Bộ 4 camera đã cấu hình + hướng dẫn cài app':rm?'VD: Cấu hình lại NVR xem qua app':'VD: Lắp 2 camera cổng'; document.getElementById('f_due').firstChild.textContent=dlv?'Giờ giao':'Hẹn khách'; };
    document.getElementById('modechips').addEventListener('click',e=>{ const c=e.target.closest('[data-mode]'); if(c) setMode(c.dataset.mode); }); }};
  render();
}
async function rememberSiteAddr(c,addr,co){ if(!addr) return; const sites=(c.sites||[]).filter(x=>normAddr(x.address)!==normAddr(addr)); sites.push({address:addr,lat:co.lat,lng:co.lng}); await Store.update('customers',c.id,{sites}); }
async function submitNewJob(f){
  const phone=f.cphone.value.replace(/\D/g,''); let c=phone?DB.customers.find(x=>x.phone===phone):null; if(!c){ const nm=f.cname.value.trim().toLowerCase(); const ms=DB.customers.filter(x=>x.name.toLowerCase()===nm); if(ms.length===1) c=ms[0]; } const co=parseCoords(f.maps.value);
  if(!c) c=await Store.insert('customers',{name:f.cname.value.trim(),phone,address:f.caddr.value.trim(),sites:[]});
  else if(f.caddr.value.trim()&&!c.address) await Store.update('customers',c.id,{address:f.caddr.value.trim()});
  if(co) await rememberSiteAddr(c,f.caddr.value.trim(),co);
  const addr=f.caddr.value.trim(); const ks=knownSite(c,addr); const site=co||ks;
  const j=await Store.insert('jobs',{code:nextCode(),customer_id:c.id,address:addr,site_lat:site?site.lat:null,site_lng:site?site.lng:null,site_auto:!co&&!!ks,type:'khac',priority:f.priority.value,title:f.title.value.trim(),description:f.description.value.trim(),assignee_id:f.assignee.value||null,due_at:f.due.value?new Date(f.due.value).toISOString():null,quote:f.quote?(+f.quote.value.replace(/\D/g,'')||0):0,mode:f.mode.value,est:+f.est.value||null,progress:0,status:'moi',created_by:me().id});
  if(j.assignee_id) await notify(j.assignee_id,'Bạn được giao việc '+j.code,j.title+(j.priority==='cao'?' · GẤP':'')+(j.due_at?' · hẹn '+fmtDT(j.due_at):''),j.id,j.priority==='cao'?'urgent':'assign');
  S.modal=null; toast('Đã tạo '+j.code+(j.mode==='delivery'?' · xuất hàng giao từ kho ở tab Vật tư':'')); openJob(j.id, j.mode==='delivery'?'vattu':undefined);
}

function openJob(id, tab){
  const j=DB.jobs.find(x=>x.id===id); if(!j) return; const c=cust(j.customer_id); const t=jobTotals(j); tab=tab||(S.modal&&S.modal.jobId===id&&S.modal.jobTab)||'nhatky';
  const staff=DB.users.filter(u=>u.active!==false); const mine=j.assignee_id===me().id; const canAct=isOwner()||mine||!j.assignee_id; const ci=openCheckin(j.id,me().id); const acc=DB.acceptances.find(a=>a.job_id===j.id);
  const logHTML=l=>{ const cls=l.type==='checkin'?'ci':l.type==='checkout'?'co':''; const ic=l.type==='checkin'?'▶':l.type==='checkout'?'■':initials(l.user_id);
    return `<div class="log ${cls}"><div class="av">${ic}</div><div style="min-width:0"><div class="small muted">${esc(shortName(l.user_id))} · <span class="mono">${fmtDT(l.created_at)}</span>${l.type==='status'?' · đổi trạng thái':''}${isRemoteSession(l)?' · <span class="pill s-cho_vat_tu">từ xa</span>':''}</div><div>${esc(l.text)}${l.flag?` <span class="pill s-huy" style="color:var(--bad)">⚑ ${FLAG_TXT[l.flag]||l.flag}</span>`:''}</div>${l.lat?`<div class="geo">📍 <a href="${mapLink(l.lat,l.lng)}" target="_blank" rel="noopener">${l.lat}, ${l.lng}</a> ±${l.acc||'?'}m${isOwner()&&l.type==='checkin'?(j.site_lat===l.lat&&j.site_lng===l.lng?' · <b style="color:var(--ok)">vị trí công trình</b>':` · <a href="#" data-pin="${l.id}">ghim làm vị trí công trình</a>`):''}</div>`:(l.type==='checkin'||l.type==='checkout')?'<div class="geo">📍 không lấy được vị trí</div>':''}${l.photo?`<img src="${l.photo}" alt="ảnh hiện trường">`:''}</div></div>`; };

async function doCheck(type, text, extra){
  const j=DB.jobs.find(x=>x.id===S.modal.jobId); toast('Đang lấy vị trí GPS…');
  const g=await getLocation();
  if(type==='checkin'){ for(const o of myOpenSessions(me().id)){ if(o.j.id===j.id&&isRemoteSession(o.ci)&&!S.remoteNext) await Store.insert('job_logs',Object.assign({job_id:j.id,user_id:me().id,type:'checkout',text:'Kết thúc ca từ xa – đến công trình'},g||{})); else if(o.j.id!==j.id) await Store.insert('job_logs',Object.assign({job_id:o.j.id,user_id:me().id,type:'checkout',text:'Tạm dừng – chuyển sang '+j.code},g||{})); } if(j.mode==='remote'||S.remoteNext) text='Bắt đầu làm từ xa'+(j.mode!=='remote'?' (phần việc xử lý online)':''); }
  const remoteSess = type==='checkin' && (j.mode==='remote' || !!S.remoteNext); S.remoteNext=false;
  const extraFlag={};
  if(type==='checkin'&&g&&!remoteSess&&!j.site_lat){ if(g.acc<=60){ await Store.update('jobs',j.id,{site_lat:g.lat,site_lng:g.lng,site_auto:true}); await rememberSite(j,g.lat,g.lng); text+=' (tự ghim làm vị trí công trình)'; } else text+=` (GPS ±${g.acc} m, chưa đủ chính xác để ghim)`; }
  if(type==='checkin'&&j.site_lat&&g&&!remoteSess){ const dm=Math.round(distM({lat:j.site_lat,lng:j.site_lng},g)); if(dm>FAR_M){ extraFlag.flag='far_start'; text+=` (cách vị trí đã ghim ${dm} m)`; } }
  await Store.insert('job_logs',Object.assign({job_id:j.id,user_id:me().id,type,text},g||{},extraFlag,remoteSess?{remote:true}:{}));
  if(type==='checkin'&&j.status==='moi'){ await Store.update('jobs',j.id,{status:'dang_lam'}); }
  if(!isOwner()) await notify(owners(),(type==='checkin'?'▶ ':'■ ')+shortName(me().id)+' '+(type==='checkin'?(remoteSess?'bắt đầu từ xa':'đến công trình'):'rời công trình')+' '+j.code,text+(g?'':' (không GPS)'),j.id,extraFlag.flag?'flag':type==='checkin'?'start':'stop');
  if(type==='checkin'&&!j.assignee_id) await Store.update('jobs',j.id,{assignee_id:me().id});
  if(extra) await extra(g);
  toast(g?`Đã ghi ${type==='checkin'?'bắt đầu':'rời công trình'} · GPS ±${g.acc}m`:'Đã ghi (không lấy được GPS – kiểm tra quyền vị trí)');
  return g;
}

function wrapText(ctx,text,x,y,maxW,lh){ for(const para of String(text).split('\n')){ let line=''; for(const w of para.split(' ')){ const test=line?line+' '+w:w; if(ctx.measureText(test).width>maxW&&line){ ctx.fillText(line,x,y); y+=lh; line=w; } else line=test; } ctx.fillText(line,x,y); y+=lh; } return y; }

async function saveAcceptance(){

  const btn=document.querySelector('[data-act="saveacc"]'); if(btn){ btn.disabled=true; btn.textContent='Đang lấy GPS…'; }

  const base={job_id:j.id,content:document.getElementById('acc_content').value,note:document.getElementById('acc_note').value,customer_name:cust(j.customer_id).name,extras,extras_priced:false,signed_at:now(),user_id:me().id,mode:photoMode?'photo':'sign',remote:!!S.accRemote};

/* ===================== CAMERA TRỰC TIẾP (chống tải ảnh có sẵn) ===================== */
let camStream=null;
async function openCamera(onShot, meta){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast('Trình duyệt không hỗ trợ camera'); return; }
  const box=document.createElement('div'); box.className='cam'; box.innerHTML=`<div class="stamp" id="camstamp">Đang lấy vị trí…</div><video autoplay playsinline muted></video><div class="bar2"><button class="btn sm ghost" style="color:#e8eef5;border-color:#3b4a5c" data-cam="flip">Đổi camera</button><button class="shut" data-cam="shot" aria-label="Chụp"></button><div style="min-width:80px;text-align:right"><span id="camcount" class="mono">0 ảnh</span><br><button class="btn sm ghost" style="color:#e8eef5;border-color:#3b4a5c;margin-top:4px" data-cam="close">Xong</button></div></div>`;
  document.body.appendChild(box); const video=box.querySelector('video'); let facing='environment', n=0, geo=null;
  const start=async()=>{ if(camStream) camStream.getTracks().forEach(t=>t.stop()); try{ camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280}},audio:false}); video.srcObject=camStream; }catch(e){ box.remove(); toast(isRemote()?'Không mở được camera – hãy cho phép quyền Camera cho ứng dụng':'Bản thử nghiệm không được cấp quyền camera; ở bản triển khai sẽ mở camera trực tiếp'); return false; } return true; };
  if(!await start()) return;
  getLocation().then(g=>{ geo=g; document.getElementById('camstamp').textContent=(g?`📍 ${g.lat}, ${g.lng} ±${g.acc}m`:'📍 không có GPS')+' · '+meta; });
  const close=()=>{ if(camStream) camStream.getTracks().forEach(t=>t.stop()); camStream=null; box.remove(); };
  box.addEventListener('click',e=>{ const b=e.target.closest('[data-cam]'); if(!b) return;
    if(b.dataset.cam==='close') close();
    if(b.dataset.cam==='flip'){ facing=facing==='environment'?'user':'environment'; start(); }
    if(b.dataset.cam==='shot'){ const vw=video.videoWidth||1280, vh=video.videoHeight||960; const sc=Math.min(1,1000/Math.max(vw,vh)); const c=document.createElement('canvas'); c.width=Math.round(vw*sc); c.height=Math.round(vh*sc); const ctx=c.getContext('2d'); ctx.drawImage(video,0,0,c.width,c.height);
      const lines=[fmtDT(now())+' · '+meta, geo?`${geo.lat}, ${geo.lng} ±${geo.acc}m`:'GPS: không có']; ctx.font=`600 ${Math.round(c.width/42)}px "JetBrains Mono", monospace`; const lh=Math.round(c.width/30); ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,c.height-lh*lines.length-14,c.width,lh*lines.length+14); ctx.fillStyle='#fff'; lines.forEach((l,i)=>ctx.fillText(l,12,c.height-lh*(lines.length-i)-2));
      onShot(c.toDataURL('image/jpeg',.82),geo); n++; document.getElementById('camcount').textContent=n+' ảnh'; video.style.opacity='.3'; setTimeout(()=>video.style.opacity='1',120); } });
}

function barChart(data, opts){ // data: [{label, value, hi}], opts: {unit, fmt, height}
  const W=720, H=opts.height||220, padL=36, padR=12, padT=18, padB=34, n=data.length; const mx=Math.max(1,...data.map(d=>d.value)); const iw=(W-padL-padR)/n; const bw=Math.min(40,iw*.66);
  const ticks=4; let g=''; for(let i=0;i<=ticks;i++){ const v=mx*i/ticks; const y=padT+(H-padT-padB)*(1-i/ticks); g+=`<line class="grid" x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}"/><text x="${padL-6}" y="${y+4}" text-anchor="end">${opts.fmt?opts.fmt(v):Math.round(v)}</text>`; }
  const bars=data.map((d,i)=>{ const h=(H-padT-padB)*d.value/mx; const x=padL+iw*i+(iw-bw)/2; const y=H-padB-h; return `<rect class="bar ${d.cls||''}" x="${x}" y="${y}" width="${bw}" height="${h}" rx="3"/>${d.value?`<text class="lbl" x="${x+bw/2}" y="${y-4}" text-anchor="middle">${opts.fmt?opts.fmt(d.value):d.value}</text>`:''}<text x="${x+bw/2}" y="${H-padB+16}" text-anchor="middle">${esc(d.label)}</text>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title||'')}">${g}${bars}</svg>`;
}

/* ===================== BÁO CÁO ===================== */
function renderBaoCao(){
  const from=periodRange(); const jobs=DB.jobs.filter(j=>new Date(j.created_at)>=from); const open=DB.jobs.filter(j=>!isClosed(j));
  const byS=Object.keys(STATUS).map(k=>[k,DB.jobs.filter(j=>j.status===k).length]); const mx=Math.max(1,...byS.map(x=>x[1]));
  const staff=DB.users.filter(u=>u.active!==false&&u.role!=='owner'); const done=u=>jobs.filter(j=>j.assignee_id===u.id&&j.status==='hoan_thanh').length, cur=u=>open.filter(j=>j.assignee_id===u.id).length, over=u=>open.filter(j=>j.assignee_id===u.id&&isOverdue(j)).length;
  const avgH=(()=>{const d=DB.jobs.filter(j=>j.done_at&&new Date(j.created_at)>=from); if(!d.length) return '—'; return (d.reduce((s,j)=>s+(new Date(j.done_at)-new Date(j.created_at)),0)/d.length/36e5).toFixed(1)+' giờ';})();
  const t0=new Date(); t0.setHours(0,0,0,0); const presence=DB.job_logs.filter(l=>(l.type==='checkin'||l.type==='checkout')&&new Date(l.created_at)>=t0).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  return `<div class="stack"><h1>Báo cáo</h1>${periodChips()}
    <div class="kpi"><div class="card"><div class="v">${jobs.length}</div><div class="l">Việc tiếp nhận</div></div><div class="card ok"><div class="v" style="color:var(--ok)">${jobs.filter(j=>j.status==='hoan_thanh').length}</div><div class="l">Hoàn thành</div></div><div class="card hi"><div class="v">${open.length}</div><div class="l">Tồn đọng (mọi kỳ)</div></div><div class="card ${open.filter(isOverdue).length?'bad':''}"><div class="v" style="color:${open.filter(isOverdue).length?'var(--bad)':'inherit'}">${open.filter(isOverdue).length}</div><div class="l">Quá hạn</div></div><div class="card"><div class="v">${avgH}</div><div class="l">TB thời gian xử lý</div></div><div class="card"><div class="v">${DB.jobs.filter(j=>j.status==='hoan_thanh'&&!DB.acceptances.some(a=>a.job_id===j.id)).length}</div><div class="l">Xong nhưng chưa có phiếu ký</div></div><div class="card ${DB.acceptances.filter(a=>a.extras&&a.extras.length&&!a.extras_priced).length?'bad':''}"><div class="v">${DB.acceptances.filter(a=>a.extras&&a.extras.length&&!a.extras_priced).length}</div><div class="l">Phát sinh chờ định giá</div></div><div class="card ${DB.acceptances.filter(a=>a.flags&&a.flags.length).length?'bad':''}"><div class="v">${DB.acceptances.filter(a=>a.flags&&a.flags.length).length}</div><div class="l">Phiếu có cờ cần xem</div></div><div class="card ${DB.jobs.filter(j=>j.status==='hoan_thanh'&&(j.quote||0)>jobTotals(j).paid).length?'bad':''}"><div class="v">${fmtVND(DB.jobs.filter(j=>j.status==='hoan_thanh'&&(j.quote||0)>jobTotals(j).paid).reduce((a,j)=>a+(j.quote-jobTotals(j).paid),0))}</div><div class="l">Xong nhưng chưa thu đủ</div></div></div>
    <div class="card"><h3 style="margin-bottom:8px">Hiện diện tại công trình hôm nay (GPS)</h3>${presence.length?`<div class="twrap"><table><tr><th>Giờ</th><th>KTV</th><th>Sự kiện</th><th>Việc</th><th>Vị trí</th><th></th></tr>${presence.map(l=>{const j=DB.jobs.find(x=>x.id===l.job_id)||{}; const isOpen=l.type==='checkin'&&openCheckin(l.job_id,l.user_id)&&openCheckin(l.job_id,l.user_id).id===l.id; const min=(Date.now()-new Date(l.created_at))/6e4; return `<tr><td class="mono">${fmtT(l.created_at)}</td><td>${esc(shortName(l.user_id))}</td><td>${l.type==='checkin'?'<span class="pill s-hoan_thanh">Bắt đầu</span>':'<span class="pill s-dang_lam">Rời</span>'}${l.flag?`<div class="flag small">⚑ ${FLAG_TXT[l.flag]}</div>`:''}${isOpen?`<div class="small ${min>480?'flag':'muted'}">đang mở · ${fmtH(min)}</div>`:''}</td><td>${esc(j.code||'')} ${esc(j.title||'')}</td><td>${l.lat?`<a href="${mapLink(l.lat,l.lng)}" target="_blank" rel="noopener" class="mono small">${l.lat}, ${l.lng}</a> <span class="small muted">±${l.acc}m</span>`:'<span class="flag">không có GPS</span>'}</td><td>${isOpen&&min>480?`<button class="btn sm danger" data-ownerclose="${l.id}">Đóng ca</button>`:''}</td></tr>`;}).join('')}</table></div>`:'<div class="empty">Hôm nay chưa có check-in nào.</div>'}<p class="small muted" style="margin-top:8px">Ca mở quá 8 giờ có thể đóng tay; ca quá 10 giờ chỉ tính tối đa 10 giờ và bị gắn cờ. KTV thao tác trong app khi ở cách công trình hơn ${FAR_M} m thì ca tự đóng và gắn cờ.</p></div>
    <div class="grid2"><div class="card"><h3 style="margin-bottom:10px">Theo trạng thái</h3><div class="bars">${byS.map(([k,n])=>`<div class="b"><span>${STATUS[k]}</span><div class="t"><i style="width:${n/mx*100}%"></i></div><span class="num" style="text-align:right">${n}</span></div>`).join('')}</div></div>
    <div class="card twrap"><h3 style="margin-bottom:10px">Theo KTV</h3><table><tr><th>KTV</th><th class="r">Xong</th><th class="r">Đang</th><th class="r">Quá hạn</th></tr>${staff.map(u=>`<tr><td>${esc(u.name)}</td><td class="r num">${done(u)}</td><td class="r num">${cur(u)}</td><td class="r num ${over(u)?'low':''}">${over(u)}</td></tr>`).join('')}</table></div></div>
    <div class="card twrap"><h3 style="margin-bottom:10px">Việc tồn đọng</h3><table><tr><th>Mã</th><th>Nội dung</th><th>Khách</th><th>KTV</th><th>Trạng thái</th><th>Hẹn</th></tr>${open.map(j=>`<tr data-job="${j.id}" style="cursor:pointer"><td class="mono">${esc(j.code)}</td><td>${esc(j.title)}</td><td>${esc(cust(j.customer_id).name||'')}</td><td>${j.assignee_id?esc(shortName(j.assignee_id)):'<span style="color:var(--warn)">chưa</span>'}</td><td><span class="pill s-${j.status}">${STATUS[j.status]}</span></td><td class="mono ${isOverdue(j)?'low':''}">${fmtDT(j.due_at)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Không còn việc tồn đọng.</td></tr>'}</table></div></div>`;
}

/* ===================== NHÂN SỰ & CÀI ĐẶT ===================== */
function renderNhanSu(){ const st=setting();
  return `<div class="stack"><div class="row"><h1 class="grow">Nhân sự</h1><button class="btn primary sm" data-act="newuser">+ Nhân viên</button></div>
    ${isRemote()?'<p class="small muted">Để nhân viên đăng nhập: tạo tài khoản (email + mật khẩu) trong Supabase → Authentication → Users; tài khoản tự hiện ở đây, sau đó sửa tên và vai trò.</p>':''}
    <div class="card twrap" style="padding:0"><table><tr><th>Tên</th><th>SĐT</th><th>Vai trò</th><th>Trạng thái</th><th></th></tr>${DB.users.map(u=>`<tr><td><b>${esc(u.name)}</b>${u.email?`<div class="small muted">${esc(u.email)}</div>`:''}</td><td class="mono">${esc(u.phone||'')}</td><td>${u.role==='owner'?'Chủ':'KTV'}</td><td>${u.active===false?'<span class="pill s-huy">Ngưng</span>':'<span class="pill s-hoan_thanh">Hoạt động</span>'}</td><td class="r"><button class="btn sm ghost" data-edituser="${u.id}">Sửa</button></td></tr>`).join('')}</table></div>
    <h3>Thông tin công ty (in trên phiếu)</h3><form id="shopf" class="card stack"><label class="f">Tên công ty<input name="shop_name" value="${esc(st.shop_name||'')}"></label><label class="f">Địa chỉ<input name="address" value="${esc(st.address||'')}"></label><label class="f">Điện thoại<input name="phone" value="${esc(st.phone||'')}"></label><div class="row" style="justify-content:flex-end"><button class="btn primary">Lưu</button></div></form></div>`;
}
function openUserForm(u){ u=u||{}; S.modal={html:`<div class="mhead"><h2>${u.id?'Sửa nhân viên':'Nhân viên mới'}</h2><button class="x" data-act="closemodal">×</button></div><form id="userform" class="stack" data-id="${u.id||''}">
  <label class="f">Họ tên<input name="name" value="${esc(u.name||'')}" required></label><label class="f">Số điện thoại<input name="phone" value="${esc(u.phone||'')}"></label>
  <label class="f">Vai trò<select name="role"><option value="staff" ${u.role!=='owner'?'selected':''}>Kỹ thuật viên</option><option value="owner" ${u.role==='owner'?'selected':''}>Chủ</option></select></label>
  <label class="f">Trạng thái<select name="active"><option value="1" ${u.active!==false?'selected':''}>Hoạt động</option><option value="0" ${u.active===false?'selected':''}>Ngưng làm</option></select></label>
  <div class="row" style="justify-content:flex-end"><button class="btn primary">Lưu</button></div></form>`}; render(); }

/* ===================== SỰ KIỆN ===================== */
document.addEventListener('click', async e=>{
  const t=e.target.closest('[data-tab],[data-act],[data-job],[data-login],[data-st],[data-mine],[data-jtab],[data-delji],[data-payexp],[data-adj],[data-edititem],[data-edituser],[data-period],[data-perf],[data-openjob],[data-quickout],[data-ownerclose],[data-seq],[data-pin],[data-notif],.modal-bg');
  if(!t) return;
  if(t.classList.contains('modal-bg')){ if(e.target===t){ S.modal=null; render(); } return; }
  if(t.dataset.tab){ S.tab=t.dataset.tab; location.hash=S.tab; render(); return; }
  if(t.dataset.login){ S.user=DB.users.find(u=>u.id===t.dataset.login); lsSet('acq_user',S.user.id); S.jobFilter.mine=!isOwner(); notifSeen=new Set(); render(); setTimeout(announceNew,400); return; }
  if(t.dataset.job){ openJob(t.dataset.job); return; }
  if(t.dataset.openjob){ openJob(t.dataset.openjob); return; }
  if(t.dataset.notif){ const n=DB.notifications.find(x=>x.id===t.dataset.notif); if(n&&!n.read) await Store.update('notifications',n.id,{read:true}); if(n&&n.job_id&&DB.jobs.some(j=>j.id===n.job_id)) openJob(n.job_id); else openNotifs(); return; }
  if(t.dataset.pin){ e.preventDefault(); const l=DB.job_logs.find(x=>x.id===t.dataset.pin); await Store.update('jobs',l.job_id,{site_lat:l.lat,site_lng:l.lng,site_auto:false}); const jj=DB.jobs.find(x=>x.id===l.job_id); await rememberSite(jj,l.lat,l.lng); toast('Đã ghim vị trí công trình; lần bắt đầu cách quá '+FAR_M+' m sẽ bị gắn cờ'); openJob(l.job_id,'nhatky'); return; }
  if(t.dataset.seq){ const ids=S._list||[]; const i=ids.indexOf(t.dataset.seq); const k=i+ +t.dataset.dir; if(i<0||k<0||k>=ids.length) return; [ids[i],ids[k]]=[ids[k],ids[i]]; for(let n=0;n<ids.length;n++) await Store.update('jobs',ids[n],{seq:n+1}); render(); return; }
  if(t.dataset.quickout){ t.disabled=true; S.modal={jobId:t.dataset.quickout,html:''}; await doCheck('checkout','Rời công trình'); S.modal=null; render(); return; }
  if(t.dataset.ownerclose){ const l=DB.job_logs.find(x=>x.id===t.dataset.ownerclose); await Store.insert('job_logs',{job_id:l.job_id,user_id:l.user_id,type:'checkout',text:'Chủ đóng ca (KTV không bấm rời)',flag:'owner',closed_by:me().id}); await notify(l.user_id,'⚑ Chủ đã đóng ca của bạn','Bạn quên bấm rời công trình; lần sau nhớ bấm Rời khi xong.',l.job_id,'flag'); toast('Đã đóng ca và gắn cờ'); render(); return; }
  if(t.dataset.mine!==undefined){ S.jobFilter.mine=!S.jobFilter.mine; render(); return; }
  if(t.dataset.st!==undefined && !S.modal){ S.jobFilter.status=t.dataset.st; render(); return; }
  if(t.dataset.period){ S.period=t.dataset.period; render(); return; }
  if(t.dataset.perf){ S.perfUser=t.dataset.perf; render(); return; }
  if(t.dataset.jtab){ openJob(S.modal.jobId,t.dataset.jtab); return; }
  if(t.dataset.st!==undefined && S.modal){ const j=DB.jobs.find(x=>x.id===S.modal.jobId); if(j.status===t.dataset.st) return; if(!isOwner()&&['hoan_thanh','huy'].includes(t.dataset.st)){ toast('Hoàn thành chỉ qua phiếu xác nhận'); return; } const old=j.status; await Store.update('jobs',j.id,{status:t.dataset.st,done_at:t.dataset.st==='hoan_thanh'?now():null}); await Store.insert('job_logs',{job_id:j.id,user_id:me().id,type:'status',text:STATUS[old]+' → '+STATUS[t.dataset.st]}); await notify(isOwner()?j.assignee_id:owners(),j.code+': '+STATUS[old]+' → '+STATUS[t.dataset.st],j.title,j.id,t.dataset.st==='hoan_thanh'?'done':'info'); openJob(j.id); return; }
  if(t.dataset.delji){ const x=DB.job_items.find(q=>q.id===t.dataset.delji); const it=DB.items.find(i=>i.id===x.item_id); if(it) await Store.update('items',it.id,{qty:+it.qty+ +x.qty}); await Store.remove('job_items',x.id); openJob(S.modal.jobId,'vattu'); return; }
  if(t.dataset.payexp){ await Store.update('expenses',t.dataset.payexp,{paid:true,paid_at:now()}); toast('Đã ghi thanh toán'); if(S.modal) openJob(S.modal.jobId,'chi'); else render(); return; }
  if(t.dataset.adj){ const it=DB.items.find(i=>i.id===t.dataset.adj); await Store.update('items',it.id,{qty:Math.max(0,+it.qty+ +t.dataset.d)}); render(); return; }
  if(t.dataset.edititem){ openItemForm(DB.items.find(i=>i.id===t.dataset.edititem)); return; }
  if(t.dataset.edituser){ openUserForm(DB.users.find(u=>u.id===t.dataset.edituser)); return; }
  const a=t.dataset.act; if(!a) return; e.preventDefault();
  if(a==='notifs') openNotifs();
  if(a==='readall'){ for(const n of myNotifs().filter(x=>!x.read)) await Store.update('notifications',n.id,{read:true}); openNotifs(); }
  if(a==='enablepush') enablePush();
  if(a==='logout'){ S.user=null; lsSet('acq_user',null); if(isRemote()) await supa.auth.signOut(); render(); }
  if(a==='reset'){ localStorage.removeItem('acq_db'); seedDemo(); Store.persist(); toast('Đã nạp lại dữ liệu mẫu'); render(); }
  if(a==='closemodal'){ S.modal=null; render(); }
  if(a==='newjob'){ if(!isOwner()){ toast('Chỉ chủ tạo việc; KTV ghi phát sinh trong phiếu xác nhận'); return; } openNewJob(); }
  if(a==='editjob') openEditJob(DB.jobs.find(x=>x.id===S.modal.jobId));
  if(a==='deljob'){ const j=DB.jobs.find(x=>x.id===S.modal.jobId); if(!j) return; if(!t.dataset.sure){ t.dataset.sure='1'; t.textContent='Chắc chắn xóa?'; return; } for(const tb of ['job_logs','job_items','expenses','payments','acceptances']) for(const r of DB[tb].filter(x=>x.job_id===j.id)) await Store.remove(tb,r.id); await Store.remove('jobs',j.id); S.modal=null; toast('Đã xóa'); render(); }
  if(a==='newitem') openItemForm();
  if(a==='delitem'){ const id=document.getElementById('itemform').dataset.id; if(!t.dataset.sure){ t.dataset.sure='1'; t.textContent='Chắc chắn xóa?'; return; } await Store.remove('items',id); S.modal=null; render(); }
  if(a==='newuser') openUserForm();
  if(a==='checkin'){ t.disabled=true; await doCheck('checkin','Có mặt tại công trình'); openJob(S.modal.jobId,'nhatky'); }
  if(a==='checkin-remote'){ t.disabled=true; S.remoteNext=true; await doCheck('checkin','Có mặt tại công trình'); openJob(S.modal.jobId,'nhatky'); }
  if(a==='checkout'){ t.disabled=true; const j=DB.jobs.find(x=>x.id===S.modal.jobId); await doCheck('checkout',j.status==='cho_vat_tu'?'Chờ vật tư – rời công trình':'Tạm nghỉ – rời công trình'); openJob(S.modal.jobId,'nhatky'); }
  if(a==='finish'||a==='newacc'){ const j=DB.jobs.find(x=>x.id===S.modal.jobId); if(!canAccept(j)){ toast(j.mode==='remote'?'Bấm Bắt đầu trước khi lập phiếu':'Phải đang có mặt tại công trình (bấm Bắt đầu tại công trình) mới nghiệm thu được'); return; } openAcceptance(S.modal.jobId); }
  if(a==='livecam'){ const j=DB.jobs.find(x=>x.id===S.modal.jobId); openCamera((img)=>{ S.accPhotos.push(img); if(S.accThumbs) S.accThumbs(); }, j.code+' · '+shortName(me().id)); }
  if(a==='viewacc') openAcceptance(S.modal.jobId,t.dataset.id);
  if(a==='saveacc') saveAcceptance();
  if(a==='quickdeliver') openQuickDeliver(S.modal.jobId);
  if(a==='collect'){ t.disabled=true; await collectDone(t.dataset.method); }
  if(a==='collect-no'){ t.disabled=true; await collectDone(null); }
  if(a==='savedeliver') saveDeliver();
  if(a==='priced'){ await Store.update('acceptances',t.dataset.id,{extras_priced:true}); const jj=DB.jobs.find(x=>x.id===S.modal.jobId); if(jj&&jj.assignee_id) await notify(jj.assignee_id,'Phát sinh ở '+jj.code+' đã được định giá','Chủ đã cập nhật giá chốt',jj.id,'money'); toast('Đã đánh dấu định giá'); openJob(S.modal.jobId,'nghiemthu'); }
  if(a==='clearsig'){ const cv=document.getElementById('sig'); cv.getContext('2d').clearRect(0,0,cv.width,cv.height); cv._dirty=false; }
  if(a==='dlsheet') downloadSheet().catch(()=>toast('Không tải được ở môi trường này – nhấn giữ ảnh để lưu'));
});
document.addEventListener('input', e=>{ const re=(id,fn)=>{ document.getElementById('view').innerHTML=fn(); const i=document.getElementById(id); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }; if(e.target.id==='jq'){ S.jobFilter.q=e.target.value; re('jq',renderJobs); } if(e.target.id==='khoq'){ S.khoQ=e.target.value; re('khoq',renderKho); } });
document.addEventListener('change', async e=>{
  if(e.target.id==='prog'){ const j=DB.jobs.find(x=>x.id===S.modal.jobId); await Store.update('jobs',j.id,{progress:+e.target.value}); document.getElementById('progv').textContent=e.target.value+'%'; }
  if(e.target.id==='assign'){ const j=DB.jobs.find(x=>x.id===S.modal.jobId); await Store.update('jobs',j.id,{assignee_id:e.target.value||null}); if(e.target.value) await notify(e.target.value,'Bạn được giao việc '+j.code,j.title+(j.priority==='cao'?' · GẤP':'')+(j.due_at?' · hẹn '+fmtDT(j.due_at):''),j.id,'assign'); await Store.insert('job_logs',{job_id:j.id,user_id:me().id,type:'status',text:'Giao cho '+(e.target.value?userName(e.target.value):'(bỏ phân công)')}); toast('Đã phân công'); openJob(j.id); }
});
document.addEventListener('submit', async e=>{
  e.preventDefault(); const f=F(e.target); const id=e.target.id;
  try{
    if(id==='loginf'){ const {data,error}=await supa.auth.signInWithPassword({email:f.lemail.value,password:f.lpass.value}); if(error){ document.getElementById('lerr').textContent='Sai email hoặc mật khẩu.'; return; } await afterRemoteLogin(data.session); }
    if(id==='jobf') await submitNewJob(f);
    if(id==='editjobf'){ const j=DB.jobs.find(x=>x.id===S.modal.jobId); const wasPrio=j.priority, wasDue=j.due_at; await Store.update('jobs',j.id,{title:f.title.value.trim(),address:f.address.value.trim(),description:f.description.value.trim(),priority:f.priority.value,mode:f.mode.value,est:+f.est.value||null,due_at:f.due.value?new Date(f.due.value).toISOString():null}); const co=parseCoords(f.maps.value); if(co&&(co.lat!==j.site_lat||co.lng!==j.site_lng)){ await Store.update('jobs',j.id,{site_lat:co.lat,site_lng:co.lng,site_auto:false}); await rememberSite(j,co.lat,co.lng); } else if(!co&&!j.site_lat){ const ks=knownSite(cust(j.customer_id),f.address.value.trim()); if(ks) await Store.update('jobs',j.id,{site_lat:ks.lat,site_lng:ks.lng,site_auto:true}); } if(j.assignee_id&&(j.priority!==wasPrio||j.due_at!==wasDue)) await notify(j.assignee_id,(j.priority==='cao'&&wasPrio!=='cao')?'Việc '+j.code+' chuyển thành GẤP':'Việc '+j.code+' đổi lịch hẹn',j.title+(j.due_at?' · hẹn '+fmtDT(j.due_at):''),j.id,j.priority==='cao'?'urgent':'info'); openJob(j.id); }
    if(id==='logf'){ const j=DB.jobs.find(x=>x.id===S.modal.jobId); const photo=f.photo.files[0]?await fileToDataURL(f.photo.files[0]):null; await Store.insert('job_logs',{job_id:j.id,user_id:me().id,type:'note',text:f.text.value.trim(),photo}); openJob(j.id,'nhatky'); silentGeoCheck(); }
    if(id==='itemf'){ const j=DB.jobs.find(x=>x.id===S.modal.jobId); const it=DB.items.find(i=>i.id===f.item.value); const q=+f.qty.value; await Store.insert('job_items',{job_id:j.id,item_id:it.id,qty:q,unit_price:+it.price||0}); await Store.update('items',it.id,{qty:+it.qty-q}); openJob(j.id,'vattu'); silentGeoCheck(); }
    if(id==='expf'){ const j=DB.jobs.find(x=>x.id===S.modal.jobId); const receipt=f.receipt.files[0]?await fileToDataURL(f.receipt.files[0]):null; await Store.insert('expenses',{job_id:j.id,user_id:me().id,desc:f.desc.value.trim(),amount:+f.amount.value.replace(/\D/g,''),paid:false,receipt}); await notify(owners(),'₫ '+shortName(me().id)+' chi mua ngoài '+fmtVND(+f.amount.value.replace(/\D/g,''))+' · '+j.code,f.desc.value.trim(),j.id,'money'); openJob(j.id,'chi'); silentGeoCheck(); }
    if(id==='quotef'){ const j=DB.jobs.find(x=>x.id===S.modal.jobId); await Store.update('jobs',j.id,{quote:+f.quote.value.replace(/\D/g,'')}); toast('Đã lưu giá'); openJob(j.id,'thu'); }
    if(id==='payf'){ const j=DB.jobs.find(x=>x.id===S.modal.jobId); await Store.insert('payments',{job_id:j.id,amount:+f.amount.value.replace(/\D/g,''),method:f.method.value,user_id:me().id}); openJob(j.id,'thu'); }
    if(id==='itemform'){ const row={name:f.name.value.trim(),sku:f.sku.value.trim(),unit:f.unit.value.trim()||'cái',qty:+f.qty.value,min_qty:+f.min_qty.value,cost:+String(f.cost.value).replace(/\D/g,''),price:+String(f.price.value).replace(/\D/g,'')}; if(e.target.dataset.id) await Store.update('items',e.target.dataset.id,row); else await Store.insert('items',row); S.modal=null; render(); }
    if(id==='userform'){ const row={name:f.name.value.trim(),phone:f.phone.value.trim(),role:f.role.value,active:f.active.value==='1'}; if(e.target.dataset.id) await Store.update('users',e.target.dataset.id,row); else { if(isRemote()){ toast('Tạo tài khoản trong Supabase trước, rồi sửa tên ở đây'); return; } await Store.insert('users',row); } S.modal=null; render(); }
    if(id==='shopf'){ const row={shop_name:f.shop_name.value.trim(),address:f.address.value.trim(),phone:f.phone.value.trim()}; if(DB.settings[0]) await Store.update('settings',DB.settings[0].id,row); else await Store.insert('settings',Object.assign({id:'main'},row)); toast('Đã lưu'); render(); }
  }catch(err){ console.error(err); toast('Lỗi: '+(err.message||err)); }
});
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(['viec','kho','thuchi','hieusuat','baocao','nhansu'].includes(h)){ S.tab=h; render(); } });

let syncTimer=null, rtChannel=null;
async function refreshRemote(){ if(!isRemote()||!S.user) return; try{ const seen=new Set(myNotifs().map(n=>n.id)); notifSeen=new Set([...notifSeen,...seen]); const before=JSON.stringify([DB.jobs.length,DB.job_logs.length,DB.acceptances.length,DB.payments.length,DB.items.length]); await Store.loadAll(S.user.role); announceNew(); const after=JSON.stringify([DB.jobs.length,DB.job_logs.length,DB.acceptances.length,DB.payments.length,DB.items.length]); if(before!==after||true){ if(!S.modal) render(); else if(S.modal.jobId&&!S.modal.accId&&!document.getElementById('sig')&&!document.getElementById('jobf')) openJob(S.modal.jobId,S.modal.jobTab); } }catch(e){ console.warn('sync',e); } }
function startSync(){ if(!isRemote()) return; clearInterval(syncTimer); syncTimer=setInterval(()=>{ if(document.visibilityState==='visible') refreshRemote(); },30000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') refreshRemote(); });
  try{ if(rtChannel) supa.removeChannel(rtChannel); rtChannel=supa.channel('db-changes'); let t=null; const bump=()=>{ clearTimeout(t); t=setTimeout(refreshRemote,800); }; ['jobs','job_logs','acceptances','payments','expenses','job_items','items','customers','users','settings','notifications'].forEach(tb=>rtChannel.on('postgres_changes',{event:'*',schema:'public',table:tb},bump)); rtChannel.subscribe(); }catch(e){ console.warn('realtime',e); } }
async function afterRemoteLogin(session){
  const {data:prof}=await supa.from('users').select('*').eq('id',session.user.id).single();
  if(!prof){ const el=document.getElementById('lerr'); if(el) el.textContent='Tài khoản chưa được gắn vào công ty.'; return; }
  S.user=prof; S.jobFilter.mine=prof.role!=='owner'; await Store.loadAll(prof.role); render(); startSync();
}
(async function boot(){
  const h=location.hash.slice(1); if(['viec','kho','thuchi','hieusuat','baocao','nhansu'].includes(h)) S.tab=h;
  let remote=false; try{ remote=await loadSupabase(); }catch(e){ console.warn('Không tải được Supabase, chạy cục bộ'); }
  if(remote){ const {data:{session}}=await supa.auth.getSession(); if(session){ await afterRemoteLogin(session); return; } render(); }
  else { await Store.loadAll(); const u=lsGet('acq_user'); if(u) S.user=DB.users.find(x=>x.id===u)||null; if(S.user) S.jobFilter.mine=!isOwner(); render(); }
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js');
      const notify = () => { if (reg.waiting) { window.__newVersionReady = true; window.__applyUpdate = () => { reg.waiting.postMessage('SKIP_WAITING'); }; if (typeof render === 'function' && typeof S !== 'undefined' && S.user) render(); } };
      reg.addEventListener('updatefound', () => { const nw = reg.installing; nw && nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) notify(); }); });
      notify();
      setInterval(() => reg.update().catch(() => {}), 15 * 60 * 1000);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
      navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.openJob && typeof openJob === 'function') setTimeout(() => openJob(e.data.openJob), 300); });
      let refreshing = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (refreshing) return; refreshing = true; location.reload(); });
    } catch (e) {}
  });
}
</script>
